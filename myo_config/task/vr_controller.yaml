defaults:
  - _self_

task:
  agent_state_keys:
    - qpos
    - qvel
    - qacc
    - act
    - ray_origin
    - ray_dir
  targets:
    - _target_: ${target:pointing}
      position:
        min: [ 0.3, -0.15, -0.35 ]
        max: [ 0.55, 0.15, -0.25 ]
      rgb:
        value: [ 1.0, 0.0, 0.0 ]
      shape: sphere
      size:
        value: 0.02
      dwell_duration: 0.25
    - _target_: ${target:pointing}
      position:
        min: [ 0.3, -0.15, -0.35 ]
        max: [ 0.55, 0.15, -0.25 ]
      rgb:
        value: [ 0.0, 1.0, 0.0 ]
      shape: box
      size:
        value: 0.01
      dwell_duration: 0.25
    - _target_: ${target:pointing}
      position:
        min: [ 0.3, -0.15, -0.35 ]
        max: [ 0.55, 0.15, -0.25 ]
      rgb:
        value: [ 0.0, 0.0, 1.0 ]
      shape: sphere
      size:
        value: 0.02
      dwell_duration: 0.25