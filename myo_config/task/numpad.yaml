# Numpad task: press a randomly generated fixed length sequence of buttons.

defaults:
  - _self_

sequence_length: 4

reach:
  reference_site: humphant
  end_effector_site: fingertip

button_press:
  enabled: false
  require_release: false

reward:
  weights:
    distance: 1
    phase_bonus: 0
    done: 10
    dc_effort: 0.0
    jac_effort: 1


targets:
  # Button 0 (bottom row)
  - _target_: ${task_target:button}
    label: "0"
    position:
      value: [0.30, -0.06, -0.36]
    rgb:
      value: [0.2, 0.2, 0.2]

  - _target_: ${task_target:button}
    label: "1"
    position:
      value: [0.35, -0.06, -0.28]
    rgb:
      value: [0.2, 0.2, 0.2]


  - _target_: ${task_target:button}
    label: "2"
    position:
      value: [0.35, -0.12, -0.28]
    rgb:
      value: [0.2, 0.2, 0.2]


  - _target_: ${task_target:button}
    label: "3"
    position:
      value: [0.35, -0.18, -0.28]
    rgb:
      value: [0.2, 0.2, 0.2]


  - _target_: ${task_target:button}
    label: "4"
    position:
      value: [0.40, -0.06, -0.20]
    rgb:
      value: [0.2, 0.2, 0.2]

  # Button "5" (center)
  - _target_: ${task_target:button}
    label: "5"
    position:
      value: [0.40, -0.12, -0.20]
    rgb:
      value: [0.2, 0.2, 0.2]


  - _target_: ${task_target:button}
    label: "6"
    position:
      value: [0.40, -0.18, -0.20]
    rgb:
      value: [0.2, 0.2, 0.2]

  # Button "7" (top-left)
  - _target_: ${task_target:button}
    label: "7"
    position:
      value: [0.45, -0.06, -0.12]
    rgb:
      value: [0.2, 0.2, 0.2]


  - _target_: ${task_target:button}
    label: "8"
    position:
      value: [0.45, -0.12, -0.12]
    rgb:
      value: [0.2, 0.2, 0.2]


  - _target_: ${task_target:button}
    label: "9"
    position:
      value: [0.45, -0.18, -0.12]
    rgb:
      value: [0.2, 0.2, 0.2]
